name: Build SARA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          unzip -o SARA_Android_Phone_Cloud_Build.zip -d .

      - name: Build APK
        run: gradle -p SARAAndroid :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SARA-APK
          path: SARAAndroid/app/build/outputs/apk/debug/app-debug.apk
