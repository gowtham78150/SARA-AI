
name: Build SARA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and prepare project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d .

          APP_GRADLE=$(find . -type f -path '*/app/build.gradle.kts' -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "app/build.gradle.kts not found"
            exit 1
          fi

          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$APP_GRADLE"
          sed -i 's/JavaVersion.VERSION_1_7/JavaVersion.VERSION_17/g' "$APP_GRADLE"

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SARA-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
