name: Build SARA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android ZIP
        run: |
          mkdir -p android-src
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found!"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d android-src

      - name: Find Gradle project
        run: |
          SETTINGS=$(find android-src -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found inside ZIP"
            find android-src -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Android project: $PROJECT_DIR"

      - name: Build SARA Debug APK
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            :app:assembleDebug

      - name: Upload SARA APK
        uses: actions/upload-artifact@v4
        with:
          name: SARA-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
